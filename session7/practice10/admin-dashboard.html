<!doctype html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Bài 10 - Bố cục Bảng Điều Khiển (Admin Dashboard Layout)</title>
        <script src="https://cdn.tailwindcss.com"></script>
    </head>

    <body class="bg-gray-100 min-h-screen flex">
        <aside
            class="hidden md:flex md:flex-col md:w-56 bg-gray-900 text-white min-h-screen p-6"
        >
            <h1 class="text-lg font-bold mb-8">TechGadget Admin</h1>
            <nav class="space-y-1">
                <a
                    href="#"
                    class="block bg-blue-600 rounded-lg px-4 py-2 text-sm font-medium"
                    >Tổng quan</a
                >
                <a
                    href="#"
                    class="block px-4 py-2 text-sm text-gray-300 hover:text-white"
                    >Đơn hàng</a
                >
                <a
                    href="#"
                    class="block px-4 py-2 text-sm text-gray-300 hover:text-white"
                    >Sản phẩm</a
                >
                <a
                    href="#"
                    class="block px-4 py-2 text-sm text-gray-300 hover:text-white"
                    >Khách hàng</a
                >
            </nav>
        </aside>

        <main class="flex-1 p-6">
            <div class="mb-6">
                <input
                    type="text"
                    placeholder="Tìm kiếm mã đơn hàng, sản phẩm..."
                    class="w-full border border-gray-300 rounded-lg px-4 py-2.5 bg-white"
                />
            </div>

            <h2 class="text-xl font-bold text-gray-900 mb-4">
                Tổng quan hệ thống
            </h2>

            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                <div class="bg-white rounded-xl p-5 shadow-sm">
                    <p class="text-gray-500 text-sm mb-1">Tổng doanh thu</p>
                    <p class="text-2xl font-bold text-gray-900">
                        125.000.000 đ
                    </p>
                </div>
                <div class="bg-white rounded-xl p-5 shadow-sm">
                    <p class="text-gray-500 text-sm mb-1">Đơn hàng mới</p>
                    <p class="text-2xl font-bold text-gray-900">342</p>
                </div>
                <div class="bg-white rounded-xl p-5 shadow-sm">
                    <p class="text-gray-500 text-sm mb-1">
                        Khách hàng truy cập
                    </p>
                    <p class="text-2xl font-bold text-gray-900">1,204</p>
                </div>
                <div class="bg-white rounded-xl p-5 shadow-sm">
                    <p class="text-gray-500 text-sm mb-1">Tỉ lệ chuyển đổi</p>
                    <p class="text-2xl font-bold text-gray-900">4.5%</p>
                </div>
            </div>
        </main>
    </body>
</html>
