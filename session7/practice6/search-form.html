<!doctype html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Bài 6 - Form Tìm Kiếm Chuyến Đi</title>
        <script src="https://cdn.tailwindcss.com"></script>
    </head>

    <body class="bg-gray-100 min-h-screen p-8">
        <div
            class="max-w-md md:max-w-3xl mx-auto bg-white rounded-xl shadow p-8 md:p-6 md:mb-8"
        >
            <form class="space-y-4 md:flex md:items-end md:gap-4">
                <div class="md:flex-1">
                    <label class="block text-sm font-bold mb-2 md:mb-1"
                        >Điểm đến</label
                    >
                    <input
                        type="text"
                        placeholder="Bạn muốn đi đâu?"
                        class="w-full border border-gray-300 rounded-lg px-4 py-3"
                    />
                </div>
                <div class="md:flex-1">
                    <label class="block text-sm font-bold mb-2 md:mb-1"
                        >Ngày đi</label
                    >
                    <input
                        type="date"
                        class="w-full border border-gray-300 rounded-lg px-4 py-3"
                    />
                </div>
                <button
                    type="submit"
                    class="w-full md:w-auto bg-blue-600 text-white font-semibold px-4 py-3 rounded-lg hover:bg-blue-700"
                >
                    Tìm kiếm
                </button>
            </form>
        </div>
    </body>
</html>
