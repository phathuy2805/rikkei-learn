<!doctype html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Bài 7 - Bảng báo cáo tài chính chuẩn trợ năng</title>
    </head>
    <body>
        <header>
            <h2>Báo Cáo Tài Chính Năm</h2>
        </header>
        <main>
            <table border="1 solid black" cellspacing="0" cellpadding="5">
                <caption>
                    Báo cáo doanh thu và lợi nhuận các quý trong năm
                </caption>
                <tr>
                    <th scope="col">Chỉ tiêu</th>
                    <th scope="col">Quý 1</th>
                    <th scope="col">Quý 2</th>
                    <th scope="col">Quý 3</th>
                    <th scope="col">Quý 4</th>
                </tr>
                <tr>
                    <th scope="row">Doanh thu (Tỷ VND)</th>
                    <td align="center">500</td>
                    <td align="center">650</td>
                    <td align="center">700</td>
                    <td align="center">850</td>
                </tr>
                <tr>
                    <th scope="row">Lợi nhuận (Tỷ VND)</th>
                    <td align="center">120</td>
                    <td align="center">180</td>
                    <td align="center">210</td>
                    <td align="center">250</td>
                </tr>
            </table>
        </main>
    </body>
</html>
