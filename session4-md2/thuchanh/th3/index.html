<!doctype html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <title>Bài 3 - Thao tác với Thuộc tính</title>

        <style>
            body {
                font-family: Arial, sans-serif;
                text-align: center;
                padding-top: 50px;
            }

            img {
                width: 300px;
                height: 200px;
                object-fit: cover;
                display: block;
                margin: 20px auto;
                border: 2px solid #333;
                border-radius: 8px;
            }

            button {
                padding: 10px 20px;
                cursor: pointer;
                font-size: 16px;
            }
        </style>
    </head>
    <body>
        <h1>Bài 3 - Thao tác với Thuộc tính</h1>

        <img
            id="my-image"
            src="https://picsum.photos/id/237/300/200"
            alt="Ảnh mặc định"
        />

        <button id="change-btn">Change Image</button>
        <script src="script.js"></script>
    </body>
</html>
