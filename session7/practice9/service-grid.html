<!doctype html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Bài 9 - Lưới Dịch Vụ Tái Sử Dụng</title>
        <script src="https://cdn.tailwindcss.com"></script>
    </head>

    <body class="bg-gray-100 min-h-screen p-8">
        <section class="max-w-5xl mx-auto">
            <h2 class="text-2xl font-bold text-center mb-8">Dịch Vụ Đi Kèm</h2>

            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                <div class="bg-white rounded-xl shadow p-6">
                    <div
                        class="w-10 h-10 bg-blue-100 text-blue-600 rounded-lg flex items-center justify-center mb-4"
                    >
                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            class="w-5 h-5"
                            fill="none"
                            viewBox="0 0 24 24"
                            stroke="currentColor"
                            stroke-width="2"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0h4"
                            />
                        </svg>
                    </div>
                    <h3 class="font-bold text-gray-900 mb-1">Khách Sạn</h3>
                    <p class="text-gray-500 text-sm">
                        Hệ thống khách sạn chuẩn quốc tế cao cấp và tiện nghi.
                    </p>
                </div>

                <div class="bg-white rounded-xl shadow p-6">
                    <div
                        class="w-10 h-10 bg-blue-100 text-blue-600 rounded-lg flex items-center justify-center mb-4"
                    >
                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            class="w-5 h-5"
                            fill="none"
                            viewBox="0 0 24 24"
                            stroke="currentColor"
                            stroke-width="2"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"
                            />
                        </svg>
                    </div>
                    <h3 class="font-bold text-gray-900 mb-1">Vé Máy Bay</h3>
                    <p class="text-gray-500 text-sm">
                        Đối tác từ các hãng hàng không hàng đầu thế giới.
                    </p>
                </div>

                <div class="bg-white rounded-xl shadow p-6">
                    <div
                        class="w-10 h-10 bg-blue-600 text-white rounded-lg flex items-center justify-center mb-4"
                    >
                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            class="w-5 h-5"
                            fill="none"
                            viewBox="0 0 24 24"
                            stroke="currentColor"
                            stroke-width="2"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"
                            />
                        </svg>
                    </div>
                    <h3 class="font-bold text-gray-900 mb-1">Bảo Hiểm</h3>
                    <p class="text-gray-500 text-sm">
                        Đảm bảo an toàn 100% trong mọi tình huống khẩn cấp.
                    </p>
                </div>

                <div class="bg-white rounded-xl shadow p-6">
                    <div
                        class="w-10 h-10 bg-blue-100 text-blue-600 rounded-lg flex items-center justify-center mb-4"
                    >
                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            class="w-5 h-5"
                            fill="none"
                            viewBox="0 0 24 24"
                            stroke="currentColor"
                            stroke-width="2"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"
                            />
                        </svg>
                    </div>
                    <h3 class="font-bold text-gray-900 mb-1">Hướng Dẫn</h3>
                    <p class="text-gray-500 text-sm">
                        Đội ngũ hướng dẫn viên người bản địa giàu kinh nghiệm.
                    </p>
                </div>
            </div>
        </section>
    </body>
</html>
