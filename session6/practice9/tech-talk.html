<!doctype html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Bài 9 - Đồng Bộ Nhận Diện Thương Hiệu (Brand Guidelines)</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
        <style>
            :root {
                --bs-primary-rgb: 174, 6, 6;
                --bs-primary: #ae0606;
                --bs-secondary-rgb: 33, 33, 33;
                --bs-secondary: #848484;
            }

            .btn-primary {
                --bs-btn-bg: var(--bs-primary);
                --bs-btn-border-color: var(--bs-primary);
                --bs-btn-hover-bg: #7c0101;
                --bs-btn-hover-border-color: #7c0101;
                --bs-btn-padding-x: 1.5rem;
            }

            .btn-outline-secondary {
                --bs-btn-color: var(--bs-secondary);
                --bs-btn-border-color: var(--bs-secondary);
                --bs-btn-hover-bg: #111;
                --bs-btn-hover-color: #fff;
                --bs-btn-padding-x: 1.5rem;
            }
        </style>
    </head>

    <body class="bg-light min-vh-100 d-flex align-items-center">
        <section class="container">
            <!--             
            Ở div này gặp 1 vấn đề là khi mà set border width cho top ko đươc
            Explain: Vì khi dùng class card thì nó sẽ có sẵn border mặc định
            nên là khi set là border-5 thì nó sẽ set border width cho tất cả các
            cạnh 
            Solution: Để giải quyết vấn đề này thì mình set border width
            về 0 trước sau đó set border top bth -->
            <div
                class="card w-75 m-auto border-0 border-top border-primary border-5 rounded-4 shadow overflow-hidden"
            >
                <div class="row g-0">
                    <div class="col-md-5">
                        <img
                            src="https://images.unsplash.com/photo-1540575467063-178a50c2df87?w=600"
                            alt="Tech Talk Event"
                            class="img-fluid h-100 object-fit-cover"
                        />
                    </div>
                    <div class="col-md-7">
                        <div
                            class="card-body p-5 d-flex flex-column justify-content-center h-100"
                        >
                            <h2
                                class="fw-bold mt-3"
                                style="color: var(--bs-primary)"
                            >
                                Tech Talk: Tương Lai Lập Trình AI
                            </h2>
                            <p class="text-muted my-4 fs-5">
                                Tham gia cùng Rikkei Academy để khám phá những
                                xu hướng công nghệ AI mới nhất và cách ứng dụng
                                vào phát triển phần mềm trong tương lai.
                            </p>
                            <p class="mb-1">
                                <strong>Thời gian:</strong> 09:00 - 12:00,
                                25/11/2026
                            </p>
                            <p class="mb-3">
                                <strong>Địa điểm:</strong> Cơ sở Rikkei Academy
                                HN
                            </p>
                            <div class="mt-2">
                                <button class="btn btn-primary me-2 fw-bold">
                                    Đăng Ký Ngay
                                </button>
                                <button
                                    class="btn btn-outline-secondary fw-bold"
                                >
                                    Xem Chi Tiết
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
