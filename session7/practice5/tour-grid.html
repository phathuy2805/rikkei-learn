<!doctype html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Bài 5 - Lưới Danh Mục Tour</title>
        <script src="https://cdn.tailwindcss.com"></script>
    </head>

    <body class="bg-gray-100 min-h-screen p-8">
        <section class="max-w-5xl mx-auto">
            <h2 class="text-2xl font-bold text-center mb-8">
                Các Tour Nổi Bật
            </h2>

            <div class="grid grid-cols-3 gap-6">
                <div class="bg-white rounded-xl shadow overflow-hidden">
                    <img
                        src="https://images.unsplash.com/photo-1528181304800-259b08848526?w=600&h=400&fit=crop"
                        alt="Thái Lan"
                        class="w-full h-48 object-cover"
                    />
                    <div class="p-4 text-center">
                        <h3 class="font-bold text-lg">Thái Lan</h3>
                        <p class="text-gray-500 text-sm mt-1">
                            Xứ sở chùa vàng
                        </p>
                    </div>
                </div>

                <div class="bg-white rounded-xl shadow overflow-hidden">
                    <img
                        src="https://images.unsplash.com/photo-1540959733332-eab4deabeeaf?w=600&h=400&fit=crop"
                        alt="Nhật Bản"
                        class="w-full h-48 object-cover"
                    />
                    <div class="p-4 text-center">
                        <h3 class="font-bold text-lg">Nhật Bản</h3>
                        <p class="text-gray-500 text-sm mt-1">
                            Hoa anh đào rực rỡ
                        </p>
                    </div>
                </div>

                <div class="bg-white rounded-xl shadow overflow-hidden">
                    <img
                        src="https://images.unsplash.com/photo-1499856871958-5b9627545d1a?w=600&h=400&fit=crop"
                        alt="Pháp"
                        class="w-full h-48 object-cover"
                    />
                    <div class="p-4 text-center">
                        <h3 class="font-bold text-lg">Pháp</h3>
                        <p class="text-gray-500 text-sm mt-1">
                            Kinh đô ánh sáng
                        </p>
                    </div>
                </div>
            </div>
        </section>
    </body>
</html>
