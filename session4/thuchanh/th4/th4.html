<!doctype html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>TH4 - display none vs visibility hidden</title>
        <link rel="stylesheet" href="dist/style.css" />
    </head>

    <body>
        <div class="row">
            <div class="box green">Sản phẩm 1</div>
            <div class="box orange display-none">Sản phẩm 2</div>
            <div class="box purple">Sản phẩm 3</div>
        </div>

        <div class="row">
            <div class="box green">Sản phẩm 4</div>
            <div class="box orange visibility-hidden">Sản phẩm 5</div>
            <div class="box purple">Sản phẩm 6</div>
        </div>
    </body>
</html>
