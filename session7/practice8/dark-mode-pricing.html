<!doctype html>
<html lang="vi" class="light">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Bài 8 - Chế Độ Tối Cho Bảng Giá</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <script>
            tailwind.config = {
                darkMode: 'class',
            }
        </script>
    </head>

    <body
        class="bg-gray-200 dark:bg-gray-900 min-h-screen flex items-center justify-center p-8 transition-colors duration-300"
    >
        <div
            class="bg-white dark:bg-gray-800 rounded-md shadow-lg p-8 max-w-sm w-full text-center transition-colors duration-300 flex flex-col items-center"
        >
            <h2 class="text-xl font-bold text-gray-900 dark:text-white mb-1">
                Tour Đà Lạt
            </h2>
            <p class="text-gray-400 dark:text-gray-400 text-sm mb-4">
                3 Ngày 2 Đêm
            </p>
            <div class="text-center mb-6" style="width: fit-content">
                <p class="mb-4">
                    <span
                        class="text-3xl font-extrabold text-blue-600 dark:text-blue-400"
                        >2.500.000đ</span
                    >
                    <span class="text-gray-500 dark:text-gray-400 text-sm"
                        >/khách</span
                    >
                </p>

                <ul
                    class="text-gray-600 dark:text-gray-300 text-sm space-y-2 text-left font-semibold"
                >
                    <li>Khách sạn 4 sao trung tâm</li>
                    <li>Xe Limousine đưa đón tận nơi</li>
                    <li>Vé tham quan tất cả các điểm</li>
                </ul>
            </div>
            <button
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-md uppercase tracking-wider text-sm"
            >
                Đặt Tour Ngay
            </button>
        </div>

        <!-- Nút Đổi Giao Diện -->
        <button
            onclick="document.documentElement.classList.toggle('dark')"
            class="fixed bottom-6 right-6 bg-white dark:bg-gray-700 text-gray-800 dark:text-white px-4 py-2 rounded-full shadow-lg text-sm font-medium hover:shadow-xl transition-all duration-300"
        >
            Đổi Giao Diện
        </button>
    </body>
</html>
