<!doctype html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Bài tập 5 - Popup Đăng ký Nhận Bản Tin</title>
        <link rel="stylesheet" href="dist/style.css" />
    </head>
    <body>
        <div class="popup-container">
            <div class="popup">
                <h1>Đăng ký nhận khuyến mãi!</h1>
                <p>
                    Nhập email của bạn để không bỏ lỡ những deal "Siêu Sale Công
                    Nghệ" mới nhất từ chúng tôi.
                </p>
                <input
                    type="email"
                    name="email"
                    id="email"
                    placeholder="Nhập địa chỉ email..."
                />
                <button class="btn-submit">Đăng ký ngay</button>
            </div>
        </div>
    </body>
</html>
