<!doctype html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>TH3 - Thực Đơn Món Ăn</title>
        <link rel="stylesheet" href="dist/style.css" />
    </head>

    <body>
        <section class="menu-section">
            <h2>Thực Đơn Của Chúng Tôi</h2>
            <div class="menu-list">
                <div class="menu-card">
                    <img
                        src="https://images.unsplash.com/photo-1512621776951-a57141f2eefd?w=200&h=200&fit=crop"
                        alt="Salad"
                    />
                    <h3>Salad Rau Củ Tươi</h3>
                    <span class="price">45.000 VNĐ</span>
                </div>
                <div class="menu-card">
                    <img
                        src="https://images.unsplash.com/photo-1603133872878-684f208fb84b?w=200&h=200&fit=crop"
                        alt="Cơm gạo lứt"
                    />
                    <h3>Cơm Gạo Lứt Bổ Dưỡng</h3>
                    <span class="price">75.000 VNĐ</span>
                </div>
                <div class="menu-card">
                    <img
                        src="https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?w=200&h=200&fit=crop"
                        alt="Pizza"
                    />
                    <h3>Pizza Hải Sản Phô Mai</h3>
                    <span class="price">120.000 VNĐ</span>
                </div>
                <div class="menu-card">
                    <img
                        src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=200&h=200&fit=crop"
                        alt="Hamburger"
                    />
                    <h3>Hamburger Bò Úc</h3>
                    <span class="price">85.000 VNĐ</span>
                </div>
                <div class="menu-card">
                    <img
                        src="https://images.unsplash.com/photo-1544025162-d76694265947?w=200&h=200&fit=crop"
                        alt="Sườn nướng"
                    />
                    <h3>Sườn Nướng BBQ</h3>
                    <span class="price">150.000 VNĐ</span>
                </div>
            </div>
        </section>
    </body>
</html>
