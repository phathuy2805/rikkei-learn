<!doctype html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Bài 8 - Trích dẫn Báo chí (Blockquote Styling)</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <blockquote>
            <p>
                Đột phá không đến từ việc cố gắng tạo ra thứ gì đó lớn lao, mà
                từ việc liên tục giải quyết các vấn đề nhỏ nhặt xung quanh cuộc
                sống của bạn. Khi bạn tập trung xây dựng sản phẩm mang lại giá
                trị thực sự cho người dùng, những điều vĩ đại sẽ tự nhiên theo
                sau.
            </p>
            <footer>- Tỷ phú công nghệ -</footer>
        </blockquote>
    </body>
</html>
