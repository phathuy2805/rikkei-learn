<!doctype html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Học lập trình cùng Tôi</title>
        <style>
            .content {
                display: flex;
            }

            main {
                flex: 1;
            }
        </style>
    </head>
    <body>
        <!-- ===== HEADER ===== -->
        <header>
            <h1>Học lập trình cùng Tôi</h1>
            <nav>
                <a href="https://example.com">Trang chủ</a>
                <a href="https://example.com/bai-viet">Bài viết</a>
                <a href="https://example.com/lien-he">Liên hệ</a>
            </nav>
        </header>

        <hr />

        <!-- ===== CONTENT AREA ===== -->
        <div class="content">
            <!-- MAIN: Nội dung chính -->
            <main>
                <section>
                    <h2>Bài viết mới nhất</h2>

                    <article>
                        <h3>Lộ trình học Front-end Web</h3>
                        <p>Nội dung bài viết...</p>
                    </article>
                </section>
            </main>

            <!-- ASIDE: Thông tin phụ + Quảng cáo -->
            <aside>
                <h2>Thông tin phụ</h2>
                <a href="https://rikkei.edu.vn" target="_blank">
                    <img
                        src="https://placehold.co/200x80?text=RikkeiEdu"
                        alt="RikkeiEdu - Khóa học lập trình"
                    />
                </a>
            </aside>
        </div>

        <hr />
        
        <!-- ===== FORM ĐĂNG KÝ BẢN TIN ===== -->
        <section>
            <p><b>Đăng ký nhận bản tin mới nhất:</b></p>
            <form>
                <input type="email" placeholder="Nhập email của bạn..." />
                <input type="submit" value="Đăng ký" />
            </form>
        </section>

        <hr />

        <!-- ===== FOOTER ===== -->
        <footer>
            <p>&copy; 2026 Nguyễn Văn A - Học viên Rikkei</p>
        </footer>
    </body>
</html>
